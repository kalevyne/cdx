[project]
name = "cdx-backend"
version = "0.1.0"
description = "CDX backend — Box API client, hashing pipeline, XRPL anchoring, DB models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "box-sdk-gen>=1.17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "alembic>=1.14",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "xrpl-py>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` as a default argument is the documented pattern, not a bug.
"app/routers/*.py" = ["B008"]
"app/auth.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

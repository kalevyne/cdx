# Alembic config for the CDX database. The database URL comes from app settings
# (DATABASE_URL), not from this file — see migrations/env.py.
#
# The app applies migrations automatically on startup (app/main.py), so running
# these by hand is only needed when authoring a new migration:
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Keep generated migrations passing `ruff check` / `ruff format --check`.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
